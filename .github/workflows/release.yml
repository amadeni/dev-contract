# Releases happen on main, never by hand: a PR bumps `version` in
# package.json (`pnpm bump`, `bump:minor`, `bump:major`), the rebase merge
# lands on main, and this workflow publishes every version that is out
# there in main's history above the highest tag but has no tag yet —
# oldest first, each from the commit that introduced it: CI, npmjs (public
# home), the GitHub Packages mirror, then the tag `v<version>` as the
# "released" mark. Every step skips what already exists, so a re-run
# (Actions → Release → Run workflow) finishes a partial release, and a run
# that GitHub dropped from the queue is caught up by the next one.
name: Release
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

# One release run at a time: a push and a manual run go one after the
# other, and since every run publishes everything pending, GitHub may drop
# a queued run without losing a version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find unreleased versions
        id: pending
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases run on main only, not on $GITHUB_REF"
            exit 1
          fi
          # Versions above the highest tag that have no tag themselves —
          # oldest first, each with the commit that introduced it. 0.0.0 is a
          # template placeholder, never a release. A tag without a package
          # (left over from hand-made releases) blocks its version: delete
          # the tag and the release runs again.
          highest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          pending=""; seen=" "
          for sha in $(git log --reverse --format=%H -- package.json); do
            # The official SemVer grammar (semver.org), on the whole value and
            # without a newline — the value ends up in shell commands, git tags
            # and runner output, so an invalid one is never echoed.
            v=$(git show "$sha:package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v="";try{v=String(JSON.parse(s).version??"")}catch{} const re=/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/; process.stdout.write(re.test(v)?v:(v?"INVALID":""))})')
            if [ "$v" = "INVALID" ]; then
              echo "::warning::package.json in $sha: version is not SemVer — skipped"
              continue
            fi
            [ -n "$v" ] && [ "$v" != "0.0.0" ] || continue
            case "$seen" in *" $v "*) continue;; esac
            seen="$seen$v "
            git rev-parse -q --verify "refs/tags/v$v" >/dev/null && continue
            if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$v" | sort -V | tail -1)" = "$highest" ]; then continue; fi
            pending="$pending $v=$sha"
          done
          echo "list=${pending# }" >> "$GITHUB_OUTPUT"
          echo "pending: ${pending:-none}"

      - uses: pnpm/action-setup@v4
        if: steps.pending.outputs.list != ''

      - uses: actions/setup-node@v4
        if: steps.pending.outputs.list != ''
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install latest npm
        if: steps.pending.outputs.list != ''
        run: npm install -g npm@latest

      # The tag comes last for each version: it means "this version is out".
      # A failed publish leaves no tag, so the next run retries; later
      # versions wait until then.
      - name: Release each version, oldest first
        if: steps.pending.outputs.list != ''
        # npmjs authenticates the run itself (Trusted Publisher, OIDC); the
        # mirror uses the workflow token. The version list arrives as an
        # environment variable, never as an expression spliced into the script.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PENDING: ${{ steps.pending.outputs.list }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # setup-node points npm at its own user config (NPM_CONFIG_USERCONFIG);
          # ~/.npmrc is not read there, so the mirror token goes into that file.
          # That file ends without a newline, so the line starts with one —
          # appended flush, it would glue onto `always-auth=…` and vanish.
          printf '\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" >> "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          npm whoami --registry=https://npm.pkg.github.com ||
            echo "::warning::npm whoami against GitHub Packages failed — the mirror step below will show whether the token is read"
          for entry in $PENDING; do
            version="${entry%%=*}"; sha="${entry#*=}"
            echo "::group::v$version ($sha)"
            git checkout -q "$sha"
            pnpm install --frozen-lockfile
            pnpm run ci
            name=$(node -p "require('./package.json').name")
            if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$name@$version already on npmjs — skipping"
            else
              npm publish --provenance --access public
            fi
            # Mirror to GitHub Packages so projects that route the whole
            # @amadeni scope there resolve this package too.
            if npm view "$name@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "$name@$version already mirrored — skipping"
            else
              npm publish --registry=https://npm.pkg.github.com --ignore-scripts
            fi
            git tag "v$version" "$sha"
            git push origin "v$version"
            echo "::endgroup::"
          done
