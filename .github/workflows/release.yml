# Releases happen on main, never by hand: a PR bumps `version` in
# package.json (`pnpm bump`, `bump:minor`, `bump:major`), the rebase merge
# lands on main, and this workflow publishes that version if it has no tag
# yet — CI first, then npmjs (public home), the GitHub Packages mirror, and
# finally the tag `v<version>` as the "released" mark. Every step skips
# what already exists, so a re-run (Actions → Release → Run workflow)
# finishes a partial release instead of dying on it.
name: Release
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

# One run per commit (a push and a manual run of the same commit go one
# after the other). Different commits run independently, so several bumps
# in quick succession never drop a queued version — each run publishes the
# version of its own commit.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag without a package (left over from the hand-made releases)
      # blocks that version: delete the tag and the release runs again.
      - name: Unreleased version?
        id: pending
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases run on main only, not on $GITHUB_REF"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged — nothing to release"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.pending.outputs.version != ''

      - uses: actions/setup-node@v4
        if: steps.pending.outputs.version != ''
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install latest npm
        if: steps.pending.outputs.version != ''
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.pending.outputs.version != ''
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        if: steps.pending.outputs.version != ''
        run: pnpm run ci

      - name: Publish to npm
        if: steps.pending.outputs.version != ''
        run: |
          name=$(node -p "require('./package.json').name")
          version=${{ steps.pending.outputs.version }}
          if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$version already on npmjs — skipping"
          else
            npm publish --provenance --access public
          fi

      # Mirror to GitHub Packages so projects that route the whole @amadeni
      # scope there (for private @amadeni/* packages from amadeni-core)
      # resolve this package too. npmjs stays the public home.
      - name: Mirror to GitHub Packages
        if: steps.pending.outputs.version != ''
        run: |
          name=$(node -p "require('./package.json').name")
          version=${{ steps.pending.outputs.version }}
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
          if npm view "$name@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$name@$version already mirrored — skipping"
          else
            npm publish --registry=https://npm.pkg.github.com --ignore-scripts
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tag comes last: it means "this version is out on every
      # registry". A failed publish leaves no tag, so the next run retries.
      - name: Tag the release
        if: steps.pending.outputs.version != ''
        run: |
          version=${{ steps.pending.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$version"
          git push origin "v$version"
