name: Release
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || \
            { echo "::error::Tag must be on the main branch"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm run ci

      - name: Publish to npm
        run: npm publish --provenance --access public

      # Mirror to GitHub Packages so projects that route the whole @amadeni
      # scope there (for private @amadeni/* packages from amadeni-core)
      # resolve this package too. npmjs stays the public home.
      - name: Mirror to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
          npm publish --registry=https://npm.pkg.github.com --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
